[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defined-outcome-research"
version = "0.1.0"
description = "Issuer terms, funded option structures and entry-time sensitivity"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
dependencies = ["numpy>=2.1,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["defined_outcome_research*"]

[tool.setuptools.package-data]
defined_outcome_research = ["protocol.json", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
